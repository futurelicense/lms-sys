name: Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build image and deploy to dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/lms-frontend:dev
            ghcr.io/${{ github.repository }}/lms-frontend:dev-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_ENV=development
            VITE_ENABLE_ANALYTICS=false
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Replace with your platform's deploy step (kubectl / helm / az / aws).
      - name: Deploy
        run: echo "Deploying ghcr.io/${{ github.repository }}/lms-frontend:dev-${{ github.sha }}"
