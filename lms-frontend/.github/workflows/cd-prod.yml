name: Deploy (production)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or SHA to deploy
        required: true

concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Re-verify before release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy:
    name: Build image and deploy to production
    needs: verify
    runs-on: ubuntu-latest
    # Requires a reviewer on the `production` environment - keep manual approval on.
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/lms-frontend:latest
            ghcr.io/${{ github.repository }}/lms-frontend:${{ github.ref_name }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_ENV=production
            VITE_ENABLE_ANALYTICS=true
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Replace with your platform's deploy step, then smoke-test /healthz.
      - name: Deploy
        run: echo "Deploying ghcr.io/${{ github.repository }}/lms-frontend:${{ github.ref_name }}"
